[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-python"
version = "0.1.0"
description = "Annotated Elements of Programming Interviews in Python personal study repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
advanced = ["mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["epi_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/epi_python"]
warn_unused_configs = true
check_untyped_defs = true
